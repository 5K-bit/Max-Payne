<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">MaxPayne terminal diagnostic walkthrough</title>
  <desc id="desc">A terminal-style product preview showing a MaxPayne workstation diagnosis.</desc>
  <rect width="1200" height="640" rx="26" fill="#070a0f"/>
  <rect x="26" y="24" width="1148" height="592" rx="16" fill="#0b1018" stroke="#283548"/>
  <rect x="26" y="24" width="1148" height="48" rx="16" fill="#121926"/>
  <rect x="26" y="56" width="1148" height="16" fill="#121926"/>
  <circle cx="56" cy="48" r="7" fill="#fb7185"/>
  <circle cx="80" cy="48" r="7" fill="#facc15"/>
  <circle cx="104" cy="48" r="7" fill="#34d399"/>
  <text x="600" y="54" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">maxpayne — BLACKFONG</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    <text x="58" y="112" fill="#5eead4">PS C:\Projects\obeos&gt;</text>
    <text x="302" y="112" fill="#f8fafc">maxpayne diagnose --profile workstation</text>

    <text x="58" y="158" fill="#64748b">MAXPAYNE / WORKSTATION HEALTH</text>
    <text x="58" y="191" fill="#34d399">PASS</text><text x="128" y="191" fill="#cbd5e1">python.available</text><text x="420" y="191" fill="#64748b">Python 3.12 runtime is available.</text>
    <text x="58" y="224" fill="#34d399">PASS</text><text x="128" y="224" fill="#cbd5e1">git.identity</text><text x="420" y="224" fill="#64748b">Git identity is configured.</text>
    <text x="58" y="257" fill="#34d399">PASS</text><text x="128" y="257" fill="#cbd5e1">ollama.server</text><text x="420" y="257" fill="#64748b">Local model service is reachable.</text>
    <text x="58" y="290" fill="#facc15">WARN</text><text x="128" y="290" fill="#cbd5e1">ports.8000</text><text x="420" y="290" fill="#f1f5f9">Port 8000 is occupied.</text>
    <text x="58" y="323" fill="#34d399">PASS</text><text x="128" y="323" fill="#cbd5e1">docker.available</text><text x="420" y="323" fill="#64748b">Docker command is available.</text>
    <text x="58" y="356" fill="#facc15">WARN</text><text x="128" y="356" fill="#cbd5e1">windows.path_pollution</text><text x="420" y="356" fill="#f1f5f9">PATH contains stale or duplicate entries.</text>

    <line x1="58" y1="390" x2="1115" y2="390" stroke="#263244"/>
    <text x="58" y="429" fill="#94a3b8">SUMMARY</text>
    <text x="170" y="429" fill="#34d399">19 pass</text>
    <text x="270" y="429" fill="#facc15">2 warn</text>
    <text x="360" y="429" fill="#fb7185">0 fail</text>
    <text x="1012" y="429" fill="#64748b">1.42s</text>

    <text x="58" y="482" fill="#5eead4">PS C:\Projects\obeos&gt;</text>
    <text x="302" y="482" fill="#f8fafc">maxpayne remediate port.free --port 8000</text>
    <text x="58" y="519" fill="#7dd3fc">DRY RUN</text><text x="150" y="519" fill="#cbd5e1">Would terminate the process currently listening on port 8000.</text>
    <text x="58" y="552" fill="#94a3b8">No changes made. Apply requires --apply --approve --allow-destructive.</text>

    <text x="58" y="591" fill="#5eead4">PS C:\Projects\obeos&gt;</text>
    <rect x="302" y="575" width="10" height="21" fill="#cbd5e1" opacity="0.9"/>
  </g>
</svg>