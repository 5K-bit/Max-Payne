<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">MaxPayne — Developer Environment Health and Recovery Engine</title>
  <desc id="desc">Dark portfolio banner for the MaxPayne developer diagnostics project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b10"/>
      <stop offset="0.58" stop-color="#0d121a"/>
      <stop offset="1" stop-color="#101a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#7dd3fc" stroke-width="1">
    <path d="M0 64H1200M0 128H1200M0 192H1200M0 256H1200M0 320H1200"/>
    <path d="M80 0V360M160 0V360M240 0V360M320 0V360M400 0V360M480 0V360M560 0V360M640 0V360M720 0V360M800 0V360M880 0V360M960 0V360M1040 0V360M1120 0V360"/>
  </g>
  <circle cx="1025" cy="145" r="112" fill="none" stroke="#38bdf8" stroke-opacity="0.14" stroke-width="2"/>
  <circle cx="1025" cy="145" r="78" fill="none" stroke="#5eead4" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M942 145h36l17-33 31 69 24-49 18 13h39" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="1025" cy="145" r="6" fill="#5eead4"/>

  <text x="72" y="112" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="5">LOCAL-FIRST SYSTEM HEALTH</text>
