<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">MaxPayne Health Console preview</title>
  <desc id="desc">A product preview showing MaxPayne diagnostic status cards and findings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a0f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" rx="26" fill="url(#bg)"/>
  <rect x="28" y="26" width="1144" height="668" rx="18" fill="#0b1018" stroke="#263244"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="62" y="78" fill="#f8fafc" font-size="32" font-weight="800">MAXPAYNE</text>
    <text x="62" y="105" fill="#64748b" font-size="14" letter-spacing="2">HEALTH CONSOLE · LOCAL NODE</text>
    <circle cx="1070" cy="72" r="7" fill="#34d399"/>
    <text x="1090" y="78" fill="#a7f3d0" font-size="14">ONLINE</text>
    <rect x="62" y="126" width="1074" height="3" rx="2" fill="url(#line)" opacity="0.8"/>

    <g>
      <rect x="62" y="158" width="240" height="120" rx="14" fill="#101722" stroke="#243244"/>
      <text x="84" y="190" fill="#94a3b8" font-size="13" letter-spacing="1">OVERALL HEALTH</text>
      <text x="84" y="243" fill="#f8fafc" font-size="42" font-weight="800">DEGRADED</text>
      <circle cx="273" cy="188" r="7" fill="#facc15"/>

      <rect x="318" y="158" width="240" height="120" rx="14" fill="#101722" stroke="#243244"/>
      <text x="340" y="190" fill="#94a3b8" font-size="13" letter-spacing="1">PASS</text>
      <text x="340" y="248" fill="#34d399" font-size="50" font-weight="800">19</text>

      <rect x="574" y="158" width="240" height="120" rx="14" fill="#101722" stroke="#243244"/>
      <text x="596" y="190" fill="#94a3b8" font-size="13" letter-spacing="1">WARN</text>
      <text x="596" y="248" fill="#facc15" font-size="50" font-weight="800">2</text>

      <rect x="830" y="158" width="306" height="120" rx="14" fill="#101722" stroke="#243244"/>
      <text x="852" y="190" fill="#94a3b8" font-size="13" letter-spacing="1">LAST SCAN</text>
      <text x="852" y="228" fill="#e2e8f0" font-size="21" font-weight="700">obeos · 1.42s</text>
      <text x="852" y="253" fill="#64748b" font-size="14">BLACKFONG · scan 7c12…</text>
    </g>

    <text x="62" y="326" fill="#f8fafc" font-size="18" font-weight="700">ACTIVE FINDINGS</text>
    <text x="1015" y="326" fill="#64748b" font-size="13">2 NEED ATTENTION</text>

    <g>
      <rect x="62" y="346" width="1074" height="106" rx="14" fill="#111827" stroke="#3f3a1f"/>
      <rect x="62" y="346" width="5" height="106" rx="3" fill="#facc15"/>
      <text x="88" y="378" fill="#facc15" font-size="13" font-weight="700">WARN · SYSTEM</text>
      <text x="88" y="409" fill="#f8fafc" font-size="20" font-weight="700">Disk usage is above the workstation threshold.</text>
      <text x="88" y="435" fill="#94a3b8" font-size="14">Review large caches and build artifacts before available space becomes critical.</text>
      <rect x="963" y="376" width="140" height="38" rx="19" fill="#1f2937" stroke="#475569"/>
      <text x="997" y="400" fill="#cbd5e1" font-size="13">VIEW EVIDENCE</text>

      <rect x="62" y="468" width="1074" height="106" rx="14" fill="#111827" stroke="#3f3a1f"/>
      <rect x="62" y="468" width="5" height="106" rx="3" fill="#facc15"/>
      <text x="88" y="500" fill="#facc15" font-size="13" font-weight="700">WARN · PORTS</text>
      <text x="88" y="531" fill="#f8fafc" font-size="20" font-weight="700">Port 8000 is occupied by an existing process.</text>
      <text x="88" y="557" fill="#94a3b8" font-size="14">A remediation is available, but destructive actions remain approval-gated.</text>
      <rect x="966" y="498" width="137" height="38" rx="19" fill="#17251f" stroke="#2f5f4d"/>
      <text x="1001" y="522" fill="#a7f3d0" font-size="13">DRY RUN</text>
    </g>

    <g>
      <rect x="62" y="602" width="1074" height="58" rx="13" fill="#0f172a" stroke="#1e293b"/>
      <text x="84" y="637" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">$ maxpayne diagnose --profile obeos</text>
      <text x="893" y="637" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">19 pass · 2 warn · 0 fail</text>
    </g>
  </g>
</svg>